<style>
/* Layout: PHZYN look — cool light ground, white floating cards, petrol-teal accent; single light theme on purpose */
:root{

  --line:#e2e9ee; --navy:#0f798e; --on-navy:#ffffff; --sand:#0f798e; --sand-soft:#e8f1f5;

  --f-body:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;

}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;direction:rtl}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}

.wrap{max-width:1240px;margin-inline:auto;padding-inline:20px}

.code{font-family:var(--f-code);font-size:.8rem;letter-spacing:.02em;direction:ltr;unicode-bidi:isolate}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding-block:10px 4px;background:linear-gradient(var(--bg) 60%,rgba(245,249,252,0))}
.hbar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:1px solid var(--line);border-radius:999px;box-shadow:0 4px 22px rgba(20,45,60,.07);padding-block:9px;padding-inline:22px 9px}
.brand{display:block;line-height:0}
.brand img{height:28px;width:auto;display:block}
.cart-btn{display:flex;align-items:center;gap:8px;background:var(--navy);color:var(--on-navy);border:0;border-radius:999px;padding-block:10px;padding-inline:18px 10px;font-weight:600;font-family:var(--f-display);box-shadow:0 4px 14px rgba(15,121,142,.28)}
.cart-btn .n{min-width:26px;height:26px;border-radius:999px;background:var(--on-navy);color:var(--navy);display:grid;place-items:center;font-size:.85rem;font-variant-numeric:tabular-nums}

/* intro */
.intro{display:flex;flex-direction:column;gap:14px;padding-block:24px 8px}
.intro h1{font-family:var(--f-display);font-weight:700;font-size:clamp(1.5rem,3.4vw,2.4rem);line-height:1.3;margin:0;text-wrap:balance;color:var(--ink)}
.intro p{color:var(--muted);margin:0 0 18px;max-width:58ch}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.steps li{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;font-size:.88rem;display:flex;gap:10px;align-items:flex-start;color:#3d4246}
.eyebrow{align-self:flex-start;background:var(--sand-soft);border:1px solid #cfe3ea;color:var(--navy);border-radius:999px;padding:3px 14px;font-size:.82rem;font-weight:600}
.steps i{font-style:normal;font-family:var(--f-display);font-weight:700;color:var(--sand);font-size:1.1rem;line-height:1.2}
.intro figure{margin:0;border-radius:14px;overflow:hidden;aspect-ratio:4/3;max-width:100%;background:var(--navy)}
.intro figure img{width:100%;height:100%;object-fit:cover;display:block}

@media (max-width:520px){.steps{gap:6px}.steps li{flex-direction:column;gap:2px;padding:8px;font-size:.78rem;line-height:1.4}}

/* filters */

.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}

.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:.88rem;display:inline-flex;gap:6px;align-items:center;color:#3d4246}

.search input{border:0;background:none;outline:none;flex:1;min-width:0}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;padding-bottom:110px}
.card{background:var(--surface);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:box-shadow .2s,transform .2s}

.card .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.tag{position:absolute;inset-block-end:10px;inset-inline-start:10px;background:var(--navy);color:#fff;font-size:.7rem;font-weight:600;letter-spacing:.08em;border-radius:8px;padding:4px 10px;direction:ltr}
.added{position:absolute;inset-block-start:8px;inset-inline-end:8px;background:var(--ok);color:#fff;font-size:.72rem;border-radius:999px;padding:2px 9px;font-weight:600}
.card .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font-family:var(--f-display);font-weight:600;font-size:1rem;line-height:1.4;margin:0;text-wrap:balance}
.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.8rem;align-items:center}
.swatches{display:flex;gap:4px}
.sw{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.18);display:inline-block}
.pick{margin-top:auto;border:0;border-top:1px solid var(--line);background:none;color:var(--navy);border-radius:0;padding:12px 0 2px;font-weight:600;text-align:start}
.pick:hover{color:#0a5a6a}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:48px 0}

/* overlay + sheets */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.sheet{position:fixed;z-index:50;background:var(--surface);color:var(--ink);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.product{inset:50% auto auto 50%;transform:translate(-50%,-50%);width:min(940px,calc(100vw - 32px));max-height:calc(100dvh - 40px);border-radius:14px;overflow:hidden}
.product .in{display:grid;grid-template-columns:1fr 1fr;min-height:0;overflow:auto}
.product .pic{background:var(--raised);display:grid;place-items:center;min-height:260px}
.product .pic img{width:100%;height:100%;max-height:70dvh;object-fit:contain;display:block}
.product .info{padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.product h2{font-family:var(--f-display);font-size:1.35rem;line-height:1.35;margin:0;text-wrap:balance}
.product .sub{color:var(--muted);margin:-6px 0 0;font-size:.9rem}
.lbl{font-size:.78rem;color:var(--muted);letter-spacing:.04em;margin-bottom:6px;display:block}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1px solid var(--line);background:var(--raised);border-radius:8px;padding:8px 12px;text-align:start;display:flex;flex-direction:column;gap:2px;min-width:0}
.opt span{font-weight:600}
.opt em{font-style:normal;color:var(--muted);font-size:.78rem;font-variant-numeric:tabular-nums}
.opt[aria-checked="true"]{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}
.opt.color{flex-direction:row;align-items:center;gap:8px}
.feat{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.feat li{background:var(--sand-soft);color:#2f5f6b;border-radius:8px;padding:3px 10px;font-size:.82rem}
.feat li.op{background:var(--navy);color:var(--on-navy);font-weight:600}
.feat.sm li{font-size:.72rem;padding:1px 7px}
table.spec{border-collapse:collapse;width:100%;font-size:.85rem}
table.spec td{border-bottom:1px solid var(--line);padding:6px 4px}
table.spec td:first-child{color:var(--muted);width:42%}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--raised)}
.qty button{border:0;background:none;width:36px;height:36px;font-size:1.1rem}
.qty output{min-width:34px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
textarea,input[type=text],input[type=tel]{width:100%;border:1px solid var(--line);background:var(--raised);border-radius:8px;padding:8px 10px;resize:vertical}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:auto}
.primary{background:var(--navy);color:var(--on-navy);border:0;border-radius:8px;padding:11px 18px;font-weight:600;flex:1}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.x{position:absolute;inset-block-start:10px;inset-inline-end:10px;width:36px;height:36px;border-radius:50%;border:0;background:var(--surface);box-shadow:0 2px 8px rgba(0,0,0,.2);font-size:1.2rem;z-index:2}
@media (max-width:720px){
  .product{inset:auto 0 0 0;transform:none;width:100%;max-height:92dvh;border-radius:16px 16px 0 0}
  .product .in{grid-template-columns:1fr}
  .product .pic{min-height:0;height:36dvh}
  .product .pic img{height:100%;max-height:100%}
  .product .info{padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
}

/* basket */
.basket{inset-block:0;inset-inline-end:0;width:min(480px,100vw);padding-top:env(safe-area-inset-top,0px)}
.basket header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.basket header h2{font-family:var(--f-display);margin:0;font-size:1.2rem}
.basket .scroll{overflow:auto;flex:1;padding:16px 20px;display:flex;flex-direction:column;gap:18px}
.line{display:grid;grid-template-columns:64px 1fr;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.line img{width:64px;height:64px;object-fit:cover;border-radius:6px;background:var(--raised)}
.line h4{margin:0;font-size:.92rem;line-height:1.4;font-family:var(--f-display);font-weight:600}
.line .v{color:var(--muted);font-size:.8rem}
.line .ctl{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.line .ctl .qty button{width:30px;height:30px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:.82rem;padding:4px}
.line input{margin-top:6px;font-size:.85rem}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .full{grid-column:1/-1}
.form label{font-size:.8rem;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.basket footer{border-top:1px solid var(--line);padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.sum{display:flex;justify-content:space-between;font-size:.9rem}
.sum b{font-variant-numeric:tabular-nums}
.send{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wa,.cp{border:0;border-radius:8px;padding:13px 10px;font-weight:600;text-align:center;text-decoration:none;display:block;font-size:.95rem}
.wa{background:#1f7a4d;color:#fff}
.cp{background:var(--navy);color:var(--on-navy)}
.cp.done{background:var(--ok);color:#fff}
.note{font-size:.78rem;color:var(--muted);margin:0}
pre.msg{white-space:pre-wrap;background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:10px;font-family:var(--f-body);font-size:.82rem;max-height:200px;overflow:auto;margin:0;user-select:text}
.confirm{background:var(--sand-soft);border-radius:8px;padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.88rem}
.basket .empty-b{color:var(--muted);text-align:center;padding:40px 10px}

/* mobile bar + toast */
.bar{position:fixed;inset-inline:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--slate);color:#fff;padding:13px 20px;display:none;justify-content:space-between;align-items:center;border:0;border-radius:999px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.22)}
@media (max-width:720px){.bar.on{display:flex}}
/* rooms & wardrobes */
select{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 10px;max-width:100%;min-width:0}
.spaces{padding-block:4px 26px;display:flex;flex-direction:column;gap:14px}
.sec-h h2{font-family:var(--f-display);font-size:1.35rem;margin:0 0 4px}
.sec-h p{margin:0;color:var(--muted);font-size:.9rem;max-width:70ch}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
#spaces{scroll-margin-top:130px}
.room{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.locpick.need{box-shadow:inset 0 0 0 2px var(--sand)}
.locpick.need #spHint{color:var(--ink);font-weight:600}
.rimg{border:0;padding:0;display:block;width:100%;aspect-ratio:16/10;max-width:100%;background:var(--raised)}
.rimg img{width:100%;height:100%;object-fit:contain;display:block}
.rb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
.rb .h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rb h3{margin:0;font-family:var(--f-display);font-size:1rem;font-weight:600}
.rb .h small{white-space:nowrap}
.units{display:flex;flex-wrap:wrap;gap:6px}
.unit{border:1px solid var(--line);background:var(--raised);border-radius:8px;padding:5px 10px;font-size:.85rem;display:inline-flex;gap:6px;align-items:center}
.unit small{color:var(--muted);font-variant-numeric:tabular-nums}
.unit[aria-pressed="true"]{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
.unit[aria-pressed="true"] small{color:inherit;opacity:.8}
.unit.add{border-style:dashed;color:var(--muted)}
.room.new .rb{gap:8px}
.inl{display:flex;gap:8px;flex-wrap:wrap}
.inl input{flex:1 1 140px;min-width:0}
.locpick{display:flex;flex-direction:column;gap:6px;background:var(--sand-soft);border-radius:10px;padding:12px}
.locpick .inl select{flex:1 1 140px}
.spcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.opt.spc{padding:6px;gap:6px;justify-content:flex-start}
.opt.spc img{width:100%;aspect-ratio:16/10;object-fit:contain;border-radius:4px;background:#fff;display:block}

.rimg img{background:#fff}
.grp{display:flex;justify-content:space-between;align-items:baseline;gap:8px;background:var(--sand-soft);border-radius:8px;padding:8px 12px;font-size:.9rem;font-family:var(--f-display);font-weight:600}
.grp small{font-family:var(--f-body);font-weight:400;color:var(--muted)}
.lightbox{inset:50% auto auto 50%;transform:translate(-50%,-50%);width:min(1200px,calc(100vw - 32px));max-height:calc(100dvh - 40px);border-radius:12px;overflow:hidden;background:var(--raised)}
.lightbox img{width:100%;max-height:calc(100dvh - 100px);object-fit:contain;display:block}
.lightbox p{margin:0;padding:10px 14px;font-family:var(--f-display);font-weight:600}
.primary:disabled{opacity:.45;cursor:not-allowed}
.spw{position:relative;display:flex}
.spw .opt{flex:1}
.zoom{position:absolute;inset-block-start:10px;inset-inline-start:10px;width:30px;height:30px;border-radius:6px;border:0;background:rgba(15,22,30,.72);color:#fff;font-size:.95rem;line-height:1}
.zoomov{position:fixed;inset:0;z-index:70;background:var(--scrim);display:grid;place-items:center;padding:16px}

.zoomov img{display:block;width:100%;max-height:80dvh;object-fit:contain}
.zoomov figcaption{padding:10px 14px;font-family:var(--f-display);font-weight:600;color:#15202c}
.zoomov .x{position:fixed}
.product .actions{position:sticky;bottom:0;background:var(--surface);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));margin-block-end:-22px;border-top:1px solid var(--line);z-index:1}
.pn summary{cursor:pointer;color:var(--muted);font-size:.88rem}
.pn textarea{margin-top:8px}
#msgFb{font-size:.8rem}
.toast{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:60;font-size:.9rem;box-shadow:0 8px 24px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function visible(){
  const q=fQ.trim().toLowerCase();
  return P.filter(p=>(fCat==="all"||p.c===fCat)&&(!q||(p.n+" "+p.code+" "+CATS[p.c]+" "+p.ft.join(" ")).toLowerCase().includes(q)));
}
function renderCats(){
  const base=P;
  const items=[["all","كل الأقسام",base.length],...Object.entries(CATS).map(([k,v])=>[k,v,base.filter(p=>p.c===k).length]).filter(x=>x[2])];
  if(fCat!=="all"&&!items.some(x=>x[0]===fCat)) fCat="all";
  $("#cats").innerHTML=items.map(([k,v,n])=>`<button type="button" class="chip" data-cat="${k}" aria-pressed="${fCat===k}">${v}<small>${fmt(n)}</small></button>`).join("");
}
function card(p){
  const q=qtyOf(p.id);
  const sizes=p.o.length>1?`${fmt(p.o.length)} ${p.ol==="الموديل"?"موديل":"مقاسات"}`:(p.o[0]?(p.o[0].l):"");
  return `<article class="card">
    <button class="ph" type="button" data-open="${p.id}" aria-label="تفاصيل ${esc(p.n)}"><img loading="lazy" src="img/${p.id}.jpg" alt="${esc(p.n)}"><span class="tag">${BRAND[p.b]}</span>${q?`<span class="added">✓ ${fmt(q)} مختار</span>`:""}</button>
    <div class="body">
      <div class="meta"><span class="code">${p.code?esc(p.code):"—"}</span><span class="swatches">${p.col.map(c=>`<i class="sw" style="background:${COLORS[c]}" title="${c}"></i>`).join("")}</span></div>

      <div class="meta"><span>${esc(sizes)}</span><span>${CATS[p.c]}</span></div>

    </div></article>`;
}

function variant(x){
  const p=byId[x.id], parts=[];
  if(x.opt>=0){const o=p.o[x.opt]; parts.push(`${p.ol||"المقاس"}: ${o.l}${o.d?` (${o.d})`:""}`);}
  if(x.color) parts.push(`اللون: ${x.color}`);
  return parts;
}
function groups(){
  const order=SPACES.map(r=>r.id), m=new Map();
  cart.forEach((x,i)=>{const k=spaceBy(x.space)?x.space:"none"; if(!m.has(k)) m.set(k,[]); m.get(k).push(i);});
  return [...m.entries()].sort((a,b)=>{const ia=order.indexOf(a[0]),ib=order.indexOf(b[0]);return (ia<0?1e9:ia)-(ib<0?1e9:ib);});
}
function codeOf(x){const p=byId[x.id]; return (x.opt>=0&&p.o[x.opt].code)||p.code;}

const loadImg=src=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src;});
function wrapLines(ctx,text,maxW){const out=[];let cur="";for(const w of String(text).split(/\s+/)){const t=cur?cur+" "+w:w;if(cur&&ctx.measureText(t).width>maxW){out.push(cur);cur=w;}else cur=t;}if(cur)out.push(cur);return out;}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function fitImg(ctx,img,x,y,w,h,bg){ctx.fillStyle=bg||"#f3f7fa";rr(ctx,x,y,w,h,14);ctx.fill();if(!img)return;ctx.save();rr(ctx,x,y,w,h,14);ctx.clip();const k=Math.min(w/img.width,h/img.height);const iw=img.width*k,ih=img.height*k;ctx.drawImage(img,x+(w-iw)/2,y+(h-ih)/2,iw,ih);ctx.restore();}

    m.font=`400 23px ${BODY}`; const vr=variant(x).flatMap(v=>wrapLines(m,v,infoW)); const nt=x.note?wrapLines(m,"ملاحظة: "+x.note,infoW).slice(0,3):[];
    const h=Math.max(T+34,18+nm.length*34+30+vr.length*30+nt.length*30+16); return{x,p,nm,meta,vr,nt,h};});
  const gl=client.notes?(m.font=`400 24px ${BODY}`,wrapLines(m,"ملاحظات عامة: "+client.notes,W-2*P)):[];

  const c=document.createElement("canvas"); c.width=W; c.height=H; const g=c.getContext("2d"); g.direction="rtl"; g.textAlign="right"; g.textBaseline="alphabetic";
  g.fillStyle="#f5f9fc"; g.fillRect(0,0,W,H);

  if(logo){const lh=44,lw=logo.width*lh/logo.height; g.drawImage(logo,R-34-lw,28+(92-lh)/2,lw,lh);}
  g.fillStyle="#6a737b"; g.font=`500 24px ${BODY}`; g.textAlign="left"; g.fillText(new Date().toLocaleDateString("ar-EG"),P+34,28+54); g.textAlign="right";
  g.fillStyle="#17191a"; g.font=`700 40px ${DISP}`; tl.forEach((l,i)=>g.fillText(l,R,186+i*56));
  let cy=186+(tl.length-1)*56+34; let cx=R;
  [[`${fmt(cart.length)} بند`,"#0f798e"],[`${fmt(totalQty())} قطعة`,"#4b4e51"],[`${fmt(gs.length)} غرفة`,"#4b4e51"]].forEach(([txt,col])=>{g.font=`600 26px ${BODY}`; const w=g.measureText(txt).width+44; g.fillStyle=col; rr(g,cx-w,cy,w,46,23); g.fill(); g.fillStyle="#fff"; g.fillText(txt,cx-22,cy+32); cx-=w+12;});
  let y=HEAD;
  gs.forEach(([k,idx],gi)=>{
    const sp=spaceBy(k), q=idx.reduce((a,i)=>a+cart[i].qty,0);

    if(sI[gi]){const ph=92,pw=Math.min(150,sI[gi].width*ph/sI[gi].height); fitImg(g,sI[gi],R-pw,y+(GH-ph)/2,pw,ph,"#fff"); tx=R-pw-18;}
    g.fillStyle="#0f798e"; g.font=`700 34px ${DISP}`; g.fillText(sp?sp.name:"بدون فراغ محدد",tx,y+GH/2+12);
    g.fillStyle="#4b4e51"; g.font=`600 26px ${BODY}`; g.textAlign="left"; g.fillText(`${fmt(q)} قطعة`,P,y+GH/2+10); g.textAlign="right";
    y+=GH;
    idx.forEach(i=>{const r=rows[i];
      g.fillStyle="#ffffff"; g.fillRect(P-12,y,W-2*P+24,r.h); g.fillStyle="#e2e9ee"; g.fillRect(P-12,y,W-2*P+24,2);

      const qy=y+r.h/2; g.fillStyle="#0f798e"; rr(g,P,qy-30,116,60,30); g.fill(); g.fillStyle="#fff"; g.font=`700 27px ${BODY}`; g.textAlign="center"; g.fillText(fmt(r.x.qty)+" قطعة",P+58,qy+10); g.textAlign="right";

function message(){
  const L=["اختيار اكسسوارات خزائن ملابس فيلا المرشد",""];
  let k=0;
  groups().forEach(([g,idx])=>{
    const q=idx.reduce((a,i)=>a+cart[i].qty,0);
    L.push(`▪ ${locLabel(cart[idx[0]])} (${q} قطعة)`);
    idx.forEach(i=>{
      const x=cart[i], p=byId[x.id], c=codeOf(x);
      L.push(`${++k}) ${p.n} – ${BRAND[p.b]}${c?` – كود ${c}`:""}`);
      variant(x).forEach(v=>L.push(`   ${v}`));
      if(p.ft.length) L.push(`   المميزات: ${p.ft.join("، ")}`);
      L.push(`   الكمية: ${x.qty}`);
      if(x.note) L.push(`   ملاحظة: ${x.note}`);
    });
    L.push("");
  });
  L.push(`إجمالي: ${cart.length} بند · ${totalQty()} قطعة`);

document.addEventListener("click",e=>{
  const t=e.target.closest("button,a,[data-close]"); if(!t) return;
  if(t.matches("[data-close]")) return closeLayer();
  if(t.dataset.open) return open("p",()=>openProduct(t.dataset.open));

    if(t.dataset.color){ sel.color=t.dataset.color; sel.note=$("#pnote").value; drawProduct(); return; }
    if(t.dataset.q){ sel.qty=Math.max(1,Math.min(999,sel.qty+(+t.dataset.q))); $("#pq").textContent=fmt(sel.qty); return; }

    if(t.dataset.rm){ cart.splice(+t.dataset.rm,1); save(); drawBasket(); refreshAll(); return; }
    if(t.id==="askClear"){ confirmClear=true; drawBasket(); return; }
    if(t.id==="noClear"){ confirmClear=false; drawBasket(); return; }
    if(t.id==="doClear"){ cart=[]; confirmClear=false; save(); drawBasket(); refreshAll(); return; }
    if(t.id==="shareImg"){ shareTable(); return; }

      const txt=message(), note=$("#copyNote");

    }
  }
});

  if(t.dataset.ln){ cart[+t.dataset.ln].note=t.value; save(); refreshMsg(); return; }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.mv){ const x=cart[+t.dataset.mv]; x.space=t.value; x.key=`${x.id}|${x.opt}|${x.color}|${x.space}`; save(); drawBasket(); refreshAll(); }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&mode) closeLayer(); });

renderCats(); refreshAll();
</script>
</body>
</html>
