sm.":`رسالة شكر خلال يوم أو يومين تُبقيك في ذهنهم وتُظهر احترافيتك.`,"Add follow-up":`إضافة متابعة`,"Add preparation notes":`إضافة ملاحظات التحضير`,"An offer is open on this application.":`يوجد عرض مفتوح على هذا الطلب.`,"Answer the offer from {company}":`الرد على عرض {company}`,"Applications that reach a named person get answered more often than ones sent to a generic inbox.":`الطلبات التي تصل إلى شخص بعينه يُرد عليها أكثر من تلك المرسلة إلى بريد عام.`,"Apply to {position} at {company}":`قدّم على {position} في {company}`,"Ask for feedback on {position} at {company}":`اسأل عن الرد على {position} في {company}`,"Ask for the offer in writing (salary, allowances, start date, probation) and save the amount so you can compare.":`اطلب العرض مكتوبًا (الراتب والبدلات وتاريخ البدء وفترة التجربة) واحفظ المبلغ لتتمكن من المقارنة.`,"Ask politely about next steps and the expected timeline.":`اسأل بلطف عن الخطوات القادمة والإطار الزمني المتوقع.`,"Check their website or LinkedIn for a current HR / careers address or number and try again.":`ابحث في موقعهم أو لينكدإن عن بريد أو رقم حديث للموارد البشرية أو التوظيف وجرّب مرة أخرى.`,"Classify {n} companies":`صنّف {n} شركة`,"Compare categories":`قارن التصنيفات`,"Comparisons by category only work once each company is classified.":`المقارنة حسب التصنيف لا تعمل إلا بعد تصنيف كل شركة.`,"Consider closing {position} at {company}":`فكّر في إغلاق {position} في {company}`,"Copy message":`نسخ الرسالة`,"Do now":`الآن`,"Draft message":`مسودة رسالة`,"Edit the details before sending — add the attachment and the name if you know it.":`عدّل التفاصيل قبل الإرسال — أضف المرفقات والاسم إن كنت تعرفه.`,"Few applications turn into interviews":`قليل من الطلبات تتحول إلى مقابلات`,"Find a named contact at {company}":`ابحث عن شخص بعينه في {company}`,"Find another contact for {company}":`ابحث عن وسيلة تواصل أخرى مع {company}`,"Follow up on {position} at {company}":`تابع طلب {position} في {company}`,"Hidden for {days}":`تم الإخفاء لمدة {days}`,Hide:`إخفاء`,"Hide for {days}":`إخفاء لمدة {days}`,"It has been {days} since your {type} interview with no news.":`مرّ {days} على مقابلتك ({type}) دون أي خبر.`,"It is {when} and there are no preparation notes yet.":`موعدها {when} ولا توجد ملاحظات تحضير بعد.`,"Keep it as a low-priority lead and put your energy into warmer opportunities.":`أبقِه فرصة منخفضة الأولوية ووجّه جهدك إلى فرص أكثر حيوية.`,"Leave it for 2–3 weeks, then try once more with a new angle (a different person or a specific role).":`اتركها من أسبوعين إلى ثلاثة، ثم حاول مرة أخرى بزاوية جديدة (شخص مختلف أو وظيفة محددة).`,"Look up the HR manager or hiring manager on LinkedIn and save them as a contact.":`ابحث عن مدير الموارد البشرية أو مدير التوظيف في لينكدإن واحفظه كجهة اتصال.`,"Message copied":`تم نسخ الرسالة`,"Message language":`لغة الرسالة`,"Negotiate the offer from {company}":`فاوض على عرض {company}`,"No reply for {days} since your last contact, and no follow-up is scheduled.":`لا رد منذ {days} من آخر تواصل، ولا توجد متابعة مجدولة.`,"Nothing to suggest right now":`لا مقترحات الآن`,"Only {pct}% of {n} applications reached an interview.":`وصلت {pct}% فقط من {n} طلب إلى مقابلة.`,"Open application":`فتح الطلب`,"Open companies":`فتح الشركات`,"Pause outreach to {company}":`أوقف التواصل مع {company} مؤقتًا`,"Prepare for your {type} interview at {company}":`استعد لمقابلتك ({type}) في {company}`,"Record the offer from {company}":`سجّل عرض {company}`,"Reply within 2–3 days. Thank them, then ask to discuss the package — salary, allowances or review date — rather than a flat yes or no.":`ردّ خلال 2–3 أيام. اشكرهم ثم اطلب مناقشة الحزمة — الراتب أو البدلات أو موعد المراجعة — بدلًا من قبول أو رفض مباشر.`,"Research the company and interviewer, pick 2–3 projects from your portfolio, and prepare 3 questions to ask them.":`ابحث عن الشركة والمحاور، واختر 2–3 مشاريع من ملف أعمالك، وجهّز 3 أسئلة تطرحها عليهم.`,"Respond within 2–3 days and ask for the terms in writing before accepting.":`ردّ خلال 2–3 أيام واطلب الشروط مكتوبة قبل القبول.`,"Select the text and copy it":`حدّد النص وانسخه`,"Select them in the companies table and set a category in one go.":`حدّدها في جدول الشركات وعيّن تصنيفًا لها دفعة واحدة.`,"Send a short note: thank them, mention one specific thing you discussed, offer anything else they need.":`أرسل رسالة قصيرة: اشكرهم، واذكر نقطة محددة ناقشتموها، واعرض أي مستند إضافي يحتاجونه.`,"Send a short, polite nudge on the channel you used, then schedule the next one for a week later.":`أرسل تذكيرًا قصيرًا ولبقًا على نفس القناة التي استخدمتها، ثم جدول التالي بعد أسبوع.`,"Send a thank-you after your {type} interview at {company}":`أرسل رسالة شكر بعد مقابلتك ({type}) في {company}`,"Send your CV and portfolio now, then log the application so follow-ups are tracked.":`أرسل سيرتك وملف أعمالك الآن، ثم سجّل الطلب لتُتابَع المتابعات.`,Soon:`قريبًا`,"Spend more of your outreach time on that category.":`خصّص وقتًا أكبر للتواصل مع هذا التصنيف.`,"Start outreach with {company}":`ابدأ التواصل مع {company}`,"Start outreach with {n} companies":`ابدأ التواصل مع {n} شركة`,"Start with an HR or recruitment email, with your CV and portfolio attached. Find a named person on LinkedIn if you can.":`ابدأ بإيميل للموارد البشرية أو التوظيف مرفقًا بسيرتك وملف أعمالك. وحاول إيجاد شخص بعينه على لينكدإن.`,"Start with the high-priority ones: HR or recruitment email first, then WhatsApp if there is no reply in a week.":`ابدأ بالأعلى أولوية: إيميل الموارد البشرية أو التوظيف أولًا، ثم واتساب إن لم يكن هناك رد خلال أسبوع.`,Suggestions:`مقترحات`,"Switch channel — try {channel} next, and keep each touch short with your CV or portfolio attached.":`غيّر القناة — جرّب {channel} تاليًا، واجعل كل رسالة قصيرة مع سيرتك أو ملف أعمالك.`,"Tailor your CV and portfolio to each role, lead with the most relevant projects, and apply through a named contact when possible.":`خصّص سيرتك وملف أعمالك لكل وظيفة، وابدأ بأكثر المشاريع صلة، وقدّم عبر شخص بعينه متى أمكن.`,"Tailor your CV and portfolio to the role, apply, then move the card to Applied.":`خصّص سيرتك وملف أعمالك للوظيفة، وقدّم، ثم انقل البطاقة إلى تم التقديم.`,"The application is at the offer stage but no offer amount is saved.":`الطلب في مرحلة العرض ولا يوجد مبلغ عرض محفوظ.`,"The deadline is in {days}.":`آخر موعد بعد {days}.`,"The deadline is today.":`آخر موعد اليوم.`,"The offer is {pct}% below the salary you expected.":`العرض أقل بنسبة {pct}% من الراتب الذي توقعته.`,"These companies are on your list but you have not tried to reach them yet.":`هذه الشركات في قائمتك ولم تحاول التواصل معها بعد.`,"Try a different channel with {company}":`جرّب قناة مختلفة مع {company}`,"View all {n}":`عرض الكل ({n})`,"What to do":`ما العمل`,"When you can":`عند الإمكان`,"You are on top of things. New suggestions appear as your data changes.":`أنت متابع لكل شيء. ستظهر مقترحات جديدة مع تغيّر بياناتك.`,"You have a reply but no application is logged for this company.":`لديك رد لكن لا يوجد طلب مسجّل لهذه الشركة.`,"You have not tried to reach this company yet.":`لم تحاول التواصل مع هذه الشركة بعد.`,"Your last attempt ({method}) got no reply after {days}.":`آخر محاولة ({method}) لم تحصل على رد بعد {days}.`,"Your last attempt came back as a wrong or bounced contact.":`آخر محاولة رجعت كوسيلة تواصل خاطئة أو مرتدّة.`,"Your recruitment coach — practical next steps based on your own data, with ready-to-send messages":`مدرّب التوظيف الخاص بك — خطوات عملية من بياناتك مع رسائل جاهزة للإرسال`,"Your recruitment coach, from your own data":`مدرّب التوظيف الخاص بك، من بياناتك`,today:`اليوم`,"{best}% of your applications there reached an interview, against {worst}% elsewhere.":`وصلت {best}% من طلباتك هناك إلى مقابلة، مقابل {worst}% في غيرها.`,"{category} companies respond better":`شركات {category} تستجيب أفضل`,"{company} replied — send what they asked for":`ردّت {company} — أرسل ما طلبته`,"{days} without any answer.":`{days} دون أي إجابة.`,"{n} attempts without a reply.":`{n} محاولات دون رد.`,"Classify 1 company":`صنّف شركة واحدة`,"Live preview · changes are saved with this page · reset anytime in Settings":`معاينة حيّة · تُحفظ تغييراتك مع هذه الصفحة · يمكنك إعادة الضبط في أي وقت من الإعدادات`,"Could not save to the page database — saved in this browser only":`تعذّر الحفظ في قاعدة بيانات الصفحة — تم الحفظ في هذا المتصفح فقط`,"A reply is the best sign you can get from a cold approach.":`الرد هو أفضل علامة تحصل عليها من تواصل مبدئي.`,"Add another attempt":`إضافة محاولة أخرى`,"Add the name of the person you contacted":`أضف اسم الشخص الذي تواصلت معه`,"Added to the company timeline":`أُضيفت إلى الجدول الزمني للشركة`,"Answer within a day: send your CV and portfolio, and log the application so follow-ups are tracked.":`ردّ خلال يوم: أرسل سيرتك وملف أعمالك، وسجّل الطلب لتُتابَع المتابعات.`,"Attempt saved":`تم حفظ المحاولة`,"Automatic follow-up marked as done":`تم تعليم المتابعة التلقائية كمنجزة`,"Company status → {status}":`حالة الشركة ← {status}`,Done:`تم`,"Edit the attempt and enter their name — they will be saved to Contacts automatically.":`عدّل المحاولة وأدخل اسمه — وسيُحفظ في جهات الاتصال تلقائيًا.`,"Follow-up scheduled for {date}":`تمت جدولة متابعة بتاريخ {date}`,"Give {company} a few days before nudging":`أمهل {company} بضعة أيام قبل التذكير`,"If there is no reply, a different channel doubles your chances without repeating yourself.":`إن لم يأتِ رد، فتغيير القناة يضاعف فرصك دون تكرار نفسك.`,"Keep WhatsApp messages short and professional, send them in working hours, and do not send repeated messages.":`اجعل رسائل واتساب قصيرة ومهنية، وأرسلها في أوقات العمل، ولا تكرّر الإرسال.`,"Keep emails short, with the CV and portfolio attached and a clear subject line (role + your name).":`اجعل الإيميل قصيرًا مع إرفاق السيرة وملف الأعمال وعنوان واضح (الوظيفة + اسمك).`,"LinkedIn or another route":`لينكدإن أو وسيلة أخرى`,"Named contacts make every follow-up warmer and keep your Contacts list useful.":`الأسماء تجعل كل متابعة أدفأ وتُبقي قائمة جهات الاتصال مفيدة.`,"Next in line: {channel}. Use this message in a week if nothing comes back.":`التالي: {channel}. استخدم هذه الرسالة
