# Pages CMS — لوحة التحكم (https://app.pagescms.org)
# كل الصور والملفات اللي بترفعها بتتحفظ جوه فولدر assets

media:
  input: assets
  output: assets

components:
  bi:
    type: object
    fields:
      - { name: en, label: English, type: string }
      - { name: ar, label: عربي, type: string }
  bitext:
    type: object
    fields:
      - { name: en, label: English, type: text }
      - { name: ar, label: عربي, type: text }

content:
  # ============================ PROJECTS ============================
  - name: projects
    label: Projects — المشاريع
    type: file
    path: content/projects.json
    format: json
    fields:
      - name: projects
        label: Projects
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title.en} — {type}"
        fields:
          - name: id
            label: Link ID
            description: "حروف إنجليزي صغيرة وشرطات بس — ده اللي بيظهر في لينك المشروع (مثال: assaf-perfumes)"
            type: string
            required: true
            pattern: { regex: "^[a-z0-9-]+$", message: "a-z, 0-9 and - only" }
          - { name: title, label: Project name — اسم المشروع, component: bi }
          - name: disciplines
            label: Section — القسم
            type: select
            required: true
            options:
              multiple: true
              values:
                - { value: execution, label: Execution — تنفيذ }
                - { value: design, label: Design — تصميم }
                - { value: competition, label: Competition — مسابقة }
          - name: type
            label: Project type — نوع المشروع
            type: select
            options:
              values:
                - { value: retail, label: Retail — متاجر }
                - { value: booths, label: Booths & kiosks — أجنحة وأكشاك }
                - { value: gym, label: Gyms — صالات رياضية }
                - { value: residential, label: Residential — سكني }
                - { value: offices, label: Offices — مكاتب }
                - { value: hospitality, label: F&B & Hospitality — ضيافة ومطاعم }
                - { value: events, label: Events — فعاليات }
                - { value: urban, label: Urban & housing — عمراني وإسكان }
                - { value: furniture, label: Furniture — أثاث }
          - name: result
            label: Competition result — نتيجة المسابقة
            type: select
            options:
              values:
                - { value: winner, label: Winner — فوز }
                - { value: shortlisted, label: Shortlisted — القائمة القصيرة }
                - { value: mention, label: Honourable mention — تنويه }
                - { value: participation, label: Participation — مشاركة }
          - name: status
            label: Status — الحالة
            type: select
            options:
              values:
                - { value: built, label: Built — تم التنفيذ }
                - { value: progress, label: In progress — قيد التنفيذ }
                - { value: concept, label: Design only — تصميم فقط }
          - { name: client, label: Client — العميل, component: bi }
          - { name: designer, label: "Design office (if not me) — مكتب التصميم", component: bi }
          - { name: company, label: Firm I worked for — الشركة اللي كنت شغال فيها, component: bi }
          - { name: location, label: Location — المكان, component: bi }
          - { name: year, label: Year — السنة, type: string }
          - { name: duration, label: Duration — المدة, component: bi }
          - { name: area, label: "Area — المساحة (مثال: 250 m²)", type: string }
          - { name: role, label: My role (short) — دوري باختصار, component: bi }
          - name: phases
            label: My role — phases I delivered / المراحل اللي عملتها
            type: select
            options:
              multiple: true
              values:
                - { value: survey, label: Site survey — الرفع المساحي }
                - { value: brief, label: Client brief — متطلبات العميل }
                - { value: moodboard, label: Mood board — لوحة المزاج }
                - { value: concept, label: Concept design — التصميم المبدئي }
                - { value: render, label: 3D & Render — 3D وإظهار }
                - { value: drawings, label: Construction drawings — رسومات تنفيذية }
                - { value: facades, label: Facade design — تصميم الواجهات }
                - { value: materials, label: Material selection — اختيار المواد }
                - { value: sampleboard, label: Sample board — السامبل بورد }
                - { value: pricing, label: Pricing — التسعير }
                - { value: supervision, label: Site supervision — الإشراف }
                - { value: handover, label: Handover — التسليم }
          - { name: tools, label: Tools / software — البرامج, type: string, list: true }
          - { name: summary, label: Overview — وصف المشروع, component: bitext }
          - name: scope
            label: Scope of work — نطاق العمل
            component: bi
            list:
              collapsible:
                collapsed: true
                summary: "{en}"
          - name: branches
            label: "Branches (optional) — الفروع (بتظهر على خريطة السعودية)"
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{name.en} — {city}"
            fields:
              - { name: name, label: Branch name — اسم الفرع, component: bi }
              - { name: place, label: "Mall / complex (optional) — المول أو المجمع", component: bi }
              - { name: area, label: "Area m² (optional) — المساحة م²", type: string }
              - name: kind
                label: "Type (optional) — نوع الفرع"
                type: select
                options:
                  values:
                    - { value: new, label: New branch — فرع جديد }
                    - { value: refit, label: Renovation — ترميم }
              - name: city
                label: City — المدينة
                type: select
                options:
                  values:
                    - { value: riyadh, label: Riyadh — الرياض }
                    - { value: jeddah, label: Jeddah — جدة }
                    - { value: makkah, label: Makkah — مكة }
                    - { value: madinah, label: Madinah — المدينة }
                    - { value: taif, label: Taif — الطائف }
                    - { value: hail, label: Hail — حائل }
                    - { value: qassim, label: Qassim — القصيم }
                    - { value: buraydah, label: Buraydah — بريدة }
                    - { value: unaizah, label: Unaizah — عنيزة }
                    - { value: tabuk, label: Tabuk — تبوك }
                    - { value: dammam, label: Dammam — الدمام }
                    - { value: khobar, label: Al Khobar — الخبر }
                    - { value: abha, label: Abha — أبها }
                    - { value: najran, label: Najran — نجران }
                    - { value: jazan, label: Jazan — جازان }
          - { name: noStagger, label: "Align paired images (no stagger) — الصور الجنب بعض على نفس الخط", type: boolean }
          - { name: family, label: "Project family ID (optional) — كود المشروع الأم لربط الصفحات", type: string }
          - { name: chapter, label: "Chapter name in the family (optional) — اسم الجزء", component: bi }
          - { name: related, label: "Companion page ID (optional) — لينك صفحة مرتبطة", type: string }
          - { name: relatedLabel, label: "Companion link label — عنوان اللينك", component: bi }
          - { name: cover, label: Cover image — صورة الغلاف, type: image }
          - { name: coverVideo, label: "Cover video (optional) — فيديو الغلاف", type: file }
          - name: media
            label: Gallery — معرض الصور والفيديو
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{type} {src}{youtube}"
            fields:
              - name: type
                label: Type
                type: select
                default: image
                options:
                  values:
                    - { value: image, label: Image — صورة }
                    - { value: video, label: Video file — فيديو }
                    - { value: youtube, label: YouTube }
                    - { value: pdf, label: "PDF (file + poster image) — ملف PDF" }
                    - { value: link, label: "Link button (put #/p/project-id in File) — زرار لينك" }
              - { name: src, label: Image / video file, type: file }
              - { name: youtube, label: "YouTube video ID (e.g. dQw4w9WgXcQ)", type: string }
              - { name: poster, label: "Video poster image (optional) — صورة الفيديو قبل التشغيل", type: image }
              - { name: caption, label: Caption — تعليق, component: bi }
              - name: size
                label: Size — الحجم
                type: select
                options:
                  values:
                    - { value: full, label: Full screen (cinematic) — بعرض الشاشة كاملة }
                    - { value: wide, label: Wide — بعرض الصفحة }
                    - { value: half, label: Half — نص الصفحة }
                    - { value: third, label: Third (vertical shots) — تلت الصفحة للصور الطولية }
                    - { value: lead, label: Lead (large, with side shots beside it) — صورة كبيرة وجنبها صور }
                    - { value: side, label: Side (stacked next to a lead) — صورة جنب الصورة الكبيرة }
              - { name: section, label: "Chapter title (optional) — عنوان مرحلة قبل الصورة", component: bi }

  # ============================ AI WORK ============================
  - name: ai
    label: AI Work — شغل الذكاء الاصطناعي
    type: file
    path: content/ai.json
    format: json
    fields:
      - name: items
        label: Items
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title.en} — {kind}"
        fields:
          - name: kind
            label: Category — التصنيف
            type: select
            required: true
            options:
              values:
                - { value: images, label: Generated images — صور مولّدة }
                - { value: sheets, label: Sheets — شيتات }
                - { value: workflows, label: Project structuring — هيكلة المشاريع }
          - { name: title, label: Title — العنوان, component: bi }
          - { name: desc, label: Description — الوصف, component: bitext }
          - { name: tools, label: Tools — الأدوات, type: string, list: true }
          - { name: src, label: Image — صورة, type: image }
          - { name: gallery, label: "Series images (optional, shown as an exhibition strip) — مجموعة صور", type: image, list: true }
          - { name: link, label: "External link (optional) — لينك خارجي", type: string }

  # ======================= ARCHITECTURAL PHOTOGRAPHY =======================
  - name: photography
    label: Photography — التصوير المعماري
    type: file
    path: content/photos.json
    format: json
    fields:
      - name: items
        label: Photos
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title.en} {src}"
        fields:
          - { name: src, label: Photo — الصورة, type: image, required: true }
          - { name: title, label: "Title (optional) — العنوان", component: bi }
          - { name: location, label: "Location (optional) — المكان", component: bi }
          - { name: year, label: "Year (optional) — السنة", type: string }
          - { name: caption, label: "Cover caption (optional) — وصف صورة الغلاف", component: bi }
          - { name: desc, label: "About the place (optional) — نبذة عن المكان", component: bi }
          - { name: thumb, label: "Small version (optional) — نسخة صغيرة", type: image }
          - name: gallery
            label: "More photos of the same place (series) — صور تانية لنفس المكان"
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{caption.en} {src}"
            fields:
              - { name: src, label: Photo — الصورة, type: image, required: true }
              - { name: thumb, label: "Small version (optional) — نسخة صغيرة", type: image }
              - { name: caption, label: "Caption (optional) — الوصف", component: bi }

  # ============================ PROFILE ============================
  - name: site
    label: Profile & CV — البيانات والسيرة
    type: file
    path: content/site.json
    format: json
    fields:
      - name: defaultLang
        label: Default language — اللغة الأساسية
        type: select
        options:
          values:
            - { value: en, label: English }
            - { value: ar, label: عربي }
      - name: profile
        label: Profile — البيانات الأساسية
        type: object
        fields:
          - { name: name, label: Name — الاسم, component: bi }
          - { name: title, label: Title — المسمى, component: bi }
          - { name: summary, label: Summary (hero) — الوصف في الواجهة, component: bitext }
          - { name: heroImage, label: Hero image — صورة الواجهة, type: image }
          - { name: photo, label: Personal photo — صورتك, type: image }
          - { name: photoLarge, label: "Large portrait 3:4 (optional) — صورة شخصية كبيرة", type: image }
          - { name: cv, label: CV (PDF), type: file }
          - { name: location, label: Location — المكان, component: bi }
          - { name: email, label: Email, type: string }
          - { name: phone, label: Phone, type: string }
          - { name: whatsapp, label: "WhatsApp (digits only, e.g. 9665…)", type: string }
          - name: socials
            label: Social links
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{label}"
            fields:
              - { name: label, label: Name, type: string }
              - { name: url, label: URL, type: string }
      - name: clients
        label: Key clients — أهم العملاء
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name.en}"
        fields:
          - { name: name, label: Client — العميل, component: bi }
          - { name: sector, label: Sector — المجال, component: bi }
      - name: experience
        label: Experience — الخبرات
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{role.en} — {company.en}"
        fields:
          - { name: role, label: Role — المسمى, component: bi }
          - { name: company, label: Company — الشركة, component: bi }
          - { name: period, label: Period — الفترة, component: bi }
          - name: points
            label: Achievements — الإنجازات
            component: bitext
            list:
              collapsible:
                collapsed: true
                summary: "{en}"
      - name: education
        label: Education — التعليم
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title.en}"
        fields:
          - { name: title, label: Title, component: bi }
          - { name: period, label: Period, type: string }
      - name: skills
        label: Skills — المهارات
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{group.en}"
        fields:
          - { name: group, label: Group, component: bi }
          - { name: items, label: Skills, type: string, list: true }
      - name: software
        label: Software — البرامج
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{group.en}"
        fields:
          - { name: group, label: Group, component: bi }
          - { name: items, label: Software, type: string, list: true }
      - name: languages
        label: Languages — اللغات
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name.en}"
        fields:
          - { name: name, label: Language, component: bi }
          - { name: level, label: Level, component: bi }
