<title>مهامي اليومية</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@600;700&display=swap">
<style>
/* Layout: شجرة الأقسام في جنب، وقايمة أو لوحة مهام في النص. كل قسم رئيسي له لون. */
:root{
  --bg:#f3f5f8; --panel:#ffffff; --line:#e1e6ee; --fg:#17202e; --muted:#667389;
  --accent:#0f766e; --accent-soft:#e0f2ef; --accent-fg:#ffffff;
  --danger:#c2362b; --danger-soft:#fbe9e7; --warn:#a85d00; --warn-soft:#fdf0dc; --ok:#2e7d4f;
  --hover:#eef1f6; --shadow:0 1px 2px rgba(20,30,50,.06),0 6px 20px rgba(20,30,50,.06);
  --f-body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --f-display:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10161f; --panel:#18202c; --line:#273243; --fg:#e8edf5; --muted:#8e9bb0;
    --accent:#3fc1b4; --accent-soft:#16332f; --accent-fg:#06201d;
    --danger:#ff7b6e; --danger-soft:#3a1f1d; --warn:#f0b35a; --warn-soft:#3a2d17; --ok:#6fcf97;
    --hover:#202a39; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10161f; --panel:#18202c; --line:#273243; --fg:#e8edf5; --muted:#8e9bb0;
  --accent:#3fc1b4; --accent-soft:#16332f; --accent-fg:#06201d;
  --danger:#ff7b6e; --danger-soft:#3a1f1d; --warn:#f0b35a; --warn-soft:#3a2d17; --ok:#6fcf97;
  --hover:#202a39; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg{width:1em;height:1em;flex:none}

#app{height:100%;display:grid;grid-template-columns:300px minmax(0,1fr)}
/* ---------- sidebar ---------- */
.side{background:var(--panel);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.brand{padding:18px 18px 10px;display:flex;align-items:center;gap:10px}
.brand b{font-family:var(--f-display);font-size:22px;letter-spacing:.2px}
.brand .logo{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-size:18px}
.sidescroll{overflow:auto;padding:4px 10px 12px;flex:1;min-height:0}
.sec-label{font-size:12px;color:var(--muted);letter-spacing:.6px;padding:14px 10px 6px;font-weight:600}
.srow{display:flex;align-items:center;gap:8px;min-height:38px;padding:0 8px;border-radius:9px;width:100%;text-align:start;color:var(--fg)}
.srow:hover{background:var(--hover)}
.srow.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.srow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .cnt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:1.4em;text-align:center}
.srow.on .cnt{color:var(--accent)}
.srow .ic{color:var(--muted);font-size:17px}
.srow.on .ic{color:var(--accent)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.chev{width:22px;height:22px;display:grid;place-items:center;border-radius:6px;color:var(--muted);flex:none}
.chev:hover{background:var(--line)}
.chev svg{transition:transform .15s}
.chev.open svg{transform:rotate(-90deg)}
.chev.none{visibility:hidden}
.sidefoot{border-top:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:8px}
.btn-add-root{display:flex;align-items:center;gap:8px;justify-content:center;min-height:38px;border:1px dashed var(--line);border-radius:9px;color:var(--muted)}
.btn-add-root:hover{border-color:var(--accent);color:var(--accent)}
.savestate{font-size:12px;color:var(--muted);text-align:center}

/* ---------- main ---------- */
.main{min-width:0;min-height:0;overflow:auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:900px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
.topbar{display:none;align-items:center;gap:10px}
.menu-btn{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;font-size:20px}
.crumbs{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.head h1{margin:0;font-family:var(--f-display);font-size:30px;line-height:1.25;text-wrap:balance;display:flex;align-items:center;gap:12px;min-width:0}
.head .sub{color:var(--muted);font-size:14px}
.tools{display:flex;flex-wrap:wrap;gap:6px}
.tbtn{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-size:13.5px;color:var(--fg)}
.tbtn:hover{background:var(--hover)}
.tbtn.danger{color:var(--danger)}
.tbtn.danger.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel)}
.seg button{min-height:36px;padding:0 14px;font-size:13.5px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.inline-form{display:flex;gap:8px;flex-wrap:wrap}
.inline-form input{flex:1;min-width:160px;min-height:40px;border:1px solid var(--accent);border-radius:9px;padding:0 12px;background:var(--panel)}
.swatches{display:flex;gap:8px;flex-wrap:wrap;padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;align-items:center}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid transparent}
.sw.on{border-color:var(--fg)}

.quick{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.quick .row1{display:flex;gap:8px}
.quick input[type=text]{flex:1;min-width:0;border:0;background:transparent;font-size:16px;min-height:42px;padding:0 6px}
.quick input[type=text]:focus{outline:none}
.quick .row2{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:8px}
.field{min-height:34px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 8px;font-size:13.5px;max-width:100%}
.btn-primary{min-height:42px;padding:0 18px;border-radius:10px;background:var(--accent);color:var(--accent-fg);font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn-primary:hover{filter:brightness(1.08)}

.group-title{font-size:13px;color:var(--muted);font-weight:600;padding:6px 4px 0;display:flex;align-items:center;gap:8px}
.group-title.late{color:var(--danger)}
ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.task{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.task.open{box-shadow:var(--shadow);border-color:var(--accent)}
.trow{display:flex;gap:12px;align-items:flex-start;padding:10px 12px}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;flex:none;margin-top:2px;color:transparent;font-size:14px}
.chk:hover{border-color:var(--accent)}
.task.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.task.doing .chk{border-color:var(--accent);background:linear-gradient(90deg,var(--accent) 50%,transparent 50%)}
.tmain{flex:1;min-width:0;text-align:start;cursor:pointer}
.ttitle{overflow-wrap:anywhere}
.task.done .ttitle{text-decoration:line-through;color:var(--muted)}
.tmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;font-size:12.5px;color:var(--muted);align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:99px;background:var(--hover);font-size:12px;white-space:nowrap}
.chip.late{background:var(--danger-soft);color:var(--danger)}
.chip.today{background:var(--warn-soft);color:var(--warn)}
.chip.ex{background:var(--accent-soft);color:var(--accent)}
.pr{font-size:15px;margin-top:2px}
.pr.p3{color:var(--danger)} .pr.p2{color:var(--warn)} .pr.p1{color:var(--muted)}

.detail{border-top:1px solid var(--line);padding:12px;display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
.detail .full{grid-column:1/-1}
.detail label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.detail input,.detail select,.detail textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;min-height:38px;font-size:14.5px;width:100%;min-width:0}
.detail textarea{min-height:76px;resize:vertical}
.detail .actions{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}

.empty{border:1px dashed var(--line);border-radius:14px;padding:34px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:17px;margin-bottom:4px}

/* board */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
.col{background:var(--hover);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:140px}
.col.over{outline:2px dashed var(--accent)}
.col h3{margin:0 2px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.col h3 span{font-weight:400;color:var(--muted);font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:grab;display:flex;flex-direction:column;gap:6px}
.card.dragging{opacity:.4}
.card .ttitle{font-size:14.5px}

.scrim{display:none}
@media (max-width:860px){
  #app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset-block:0;inset-inline-start:0;width:min(320px,86vw);z-index:30;transform:translateX(100%);transition:transform .2s;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px)}
  .side.show{transform:none}
  .scrim.show{display:block;position:fixed;inset:0;background:rgba(10,15,25,.45);z-index:20}
  .topbar{display:flex}
  .board{grid-template-columns:minmax(0,1fr)}
  .head h1{font-size:25px}
  .detail{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app" dir="rtl" lang="ar">
  <aside class="side" id="side"></aside>
  <div class="scrim" id="scrim"></div>
  <main class="main"><div class="wrap" id="main"></div></main>
</div>

<script>
(function(){
const LS="mohamed-tasks-v1";
const COLORS=["#0f766e","#2563eb","#c2410c","#7c3aed","#be185d","#4d7c0f","#b45309","#475569"];
const PRIO=[["0","عادية"],["1","منخفضة"],["2","متوسطة"],["3","عاجلة"]];
const STAT=[["todo","لسه"],["doing","شغّال عليها"],["done","خلصت"]];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=p=>p+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3);
const nf=new Intl.NumberFormat("ar-EG");
const num=n=>nf.format(n);
function ymd(d){const z=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())}
const todayStr=()=>ymd(new Date());
function addDays(n){const d=new Date();d.setDate(d.getDate()+n);return ymd(d)}
function dayDiff(s){const a=new Date(s+"T00:00:00"),b=new Date(todayStr()+"T00:00:00");return Math.round((a-b)/864e5)}
const I={
  chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  menu:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>',
  all:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>',
  done:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>',
  list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>',
  board:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3.5" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="10" rx="1.5"/><rect x="16.5" y="4" width="4" height="13" rx="1.5"/></svg>',
  flag:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 3h2v18H5zM8 4h11l-2.5 4L19 12H8z"/></svg>'
};

/* ---------- data ---------- */
function seed(){
  const n=[],t=[];
  const add=(name,parent,color)=>{const id=uid("n");n.push({id,name,parent,color:color||null,open:true});return id};
  const vivid=add("شركة فيفيد",null,COLORS[1]);
  add("فيلا المرشد",vivid);
  const ina=add("مخازن العناية",null,COLORS[0]);
  add("المكتب",ina);
  const br=add("الفروع",ina);
  const b1=add("فرع ١",br), b2=add("فرع ٢",br), b3=add("فرع ٣",br);
  const fol=add("متابعات",br), dr=add("تسليم رسومات",br);
  const gh=add("غنيم",null,COLORS[2]);
  const gw=add("مهام الشغل",gh), go=add("مهام المكتب",gh);
  const mk=(node,title,due,pr,status,note)=>t.push({id:uid("t"),node,title,due,prio:pr,status:status||"todo",note:note||"",created:Date.now(),ex:true});
  mk(dr,"مثال: راجع الرسومات النهائية قبل التسليم",todayStr(),3);
  mk(fol,"مثال: اتصل بالفرع وتابع التوريد",addDays(1),2);
  mk(gw,"مثال: جهّز الموقف الأسبوعي",addDays(3),1,"doing");
  mk(go,"مثال: رتّب ملفات الأسبوع",null,0);
  return {nodes:n,tasks:t,updated:1};
}
let S=null;
try{const r=localStorage.getItem(LS);if(r)S=JSON.parse(r)}catch(e){}
if(!S||!Array.isArray(S.nodes))S=seed();
function migrate(d){
  if(d.beyond)return false;
  d.beyond=1;
  const root=uid("n");
  d.nodes.push({id:root,name:"مكتب بيوند",parent:null,color:COLORS[3],open:true});
  d.nodes.push({id:uid("n"),name:"شغل مكتب بيوند",parent:root,color:null,open:true});
  d.nodes.push({id:uid("n"),name:"تنفيذ مكتب بيوند",parent:root,color:null,open:true});
  return true;
}
if(migrate(S)){S.updated=Date.now();try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
let UI={sel:"view:today",mode:"list",showDone:false,open:null,rename:false,addChild:false,color:false,confirm:false,drawer:false,qn:null};
try{const u=JSON.parse(localStorage.getItem(LS+"-ui")||"null");if(u){UI.sel=u.sel||UI.sel;UI.mode=u.mode||UI.mode;UI.showDone=!!u.showDone}}catch(e){}
function saveUI(){try{localStorage.setItem(LS+"-ui",JSON.stringify({sel:UI.sel,mode:UI.mode,showDone:UI.showDone}))}catch(e){}}

/* ---------- persistence ---------- */
let ref=null,timer=null,saving=false,again=false,state="local";
function setState(s){state=s;const el=$("#savestate");if(el)el.textContent=s==="saved"?"محفوظ على حسابك":s==="saving"?"بيتحفظ…":"محفوظ على الجهاز ده بس"}
function persist(){
  S.updated=Date.now();
  try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
  if(ref){setState("saving");clearTimeout(timer);timer=setTimeout(saveDb,600)}
}
async function saveDb(){
  if(!ref)return;
  if(saving){again=true;return}
  saving=true;
  try{await ref.set(JSON.parse(JSON.stringify(S)));setState("saved")}catch(e){setState("local")}
  saving=false;
  if(again){again=false;saveDb()}
}
async function connect(){
  try{
    if(!window.claude||!claude.use)return;
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user)return;
    const id=await user.id();
    if(!id)return;
    const r=db.doc("data/users/"+id+"/profile");
    const snap=await Promise.race([r.get(),new Promise((_,j)=>setTimeout(()=>j(new Error("timeout")),10000))]);
    ref=r;
    const d=snap.exists?snap.data():null;
    if(d&&Array.isArray(d.nodes)&&(d.updated||0)>=(S.updated||0)){
      S=JSON.parse(JSON.stringify(d));
      if(migrate(S)){S.updated=Date.now();saveDb()}
      try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
      if(!node(UI.sel)&&!UI.sel.startsWith("view:"))UI.sel="view:today";
      render();setState("saved");
    }else{saveDb()}
  }catch(e){ref=null;setState("local")}
}

/* ---------- helpers ---------- */
const node=id=>S.nodes.find(n=>n.id===id);
const kids=id=>S.nodes.filter(n=>n.parent===id);
function subtree(id){const out=[id];kids(id).forEach(k=>out.push(...subtree(k.id)));return out}
function rootOf(id){let n=node(id);while(n&&n.parent)n=node(n.parent);return n}
function colorOf(id){const r=rootOf(id);return (r&&r.color)||COLORS[7]}
function pathOf(id){const p=[];let n=node(id);while(n){p.unshift(n.name);n=n.parent?node(n.parent):null}return p}
function flatNodes(){const out=[];(function walk(p,d){kids(p).forEach(n=>{out.push({n,d});walk(n.id,d+1)})})(null,0);return out}
const openCount=ids=>{const s=new Set(ids);return S.tasks.filter(t=>t.status!=="done"&&s.has(t.node)).length};
function dueChip(t){
  if(!t.due)return"";
  const d=dayDiff(t.due);
  if(t.status!=="done"&&d<0)return `<span class="chip late">متأخرة ${num(-d)} ${-d===1?"يوم":-d===2?"يومين":"يوم"}</span>`;
  if(d===0)return `<span class="chip today">النهارده</span>`;
  if(d===1)return `<span class="chip">بكرة</span>`;
  return `<span class="chip">${new Date(t.due+"T00:00:00").toLocaleDateString("ar-EG",{day:"numeric",month:"short"})}</span>`;
}
function sortTasks(a,b){
  const ad=a.status==="done",bd=b.status==="done";
  if(ad!==bd)return ad?1:-1;
  const x=a.due||"9999",y=b.due||"9999";
  if(x!==y)return x<y?-1:1;
  if(a.prio!==b.prio)return b.prio-a.prio;
  return a.created-b.created;
}
function tasksForSel(){
  const sel=UI.sel,T=S.tasks;
  if(sel==="view:today")return T.filter(t=>t.status!=="done"&&t.due&&t.due<=todayStr());
  if(sel==="view:upcoming")return T.filter(t=>t.status!=="done"&&t.due&&t.due>todayStr());
  if(sel==="view:all")return T.filter(t=>UI.showDone||t.status!=="done");
  if(sel==="view:done")return T.filter(t=>t.status==="done");
  const ids=new Set(subtree(sel));
  return T.filter(t=>ids.has(t.node)&&(UI.showDone||t.status!=="done"));
}
const VIEWS={
  "view:today":["النهارده","المهام اللي ميعادها النهارده أو فاتت",I.sun],
  "view:upcoming":["الجاية","المهام اللي ميعادها بعد النهارده",I.cal],
  "view:all":["كل المهام","كل حاجة في كل الأقسام",I.all],
  "view:done":["اللي خلصت","المهام المنتهية",I.done]
};

/* ---------- render ---------- */
function renderSide(){
  const views=Object.keys(VIEWS).map(k=>{
    let c=0;
    if(k==="view:today")c=S.tasks.filter(t=>t.status!=="done"&&t.due&&t.due<=todayStr()).length;
    if(k==="view:upcoming")c=S.tasks.filter(t=>t.status!=="done"&&t.due&&t.due>todayStr()).length;
    if(k==="view:all")c=S.tasks.filter(t=>t.status!=="done").length;
    if(k==="view:done")c=S.tasks.filter(t=>t.status==="done").length;
    return `<button class="srow ${UI.sel===k?"on":""}" data-act="sel" data-id="${k}"><span class="ic">${VIEWS[k][2]}</span><span class="nm">${VIEWS[k][0]}</span><span class="cnt">${num(c)}</span></button>`;
  }).join("");
  function tree(pid,depth){
    return kids(pid).map(n=>{
      const ks=kids(n.id),has=ks.length>0;
      const row=`<div class="srow ${UI.sel===n.id?"on":""}" style="padding-inline-start:${8+depth*16}px">
        <button class="chev ${has?(n.open?"open":""):"none"}" data-act="fold" data-id="${n.id}" aria-label="طي أو فتح">${I.chev}</button>
        <button class="srow" style="padding:0;min-height:38px;flex:1;min-width:0" data-act="sel" data-id="${n.id}">
          ${depth===0?`<span class="dot" style="background:${n.color||COLORS[7]}"></span>`:""}
          <span class="nm">${esc(n.name)}</span><span class="cnt">${num(openCount(subtree(n.id)))}</span>
        </button></div>`;
      return row+(has&&n.open?tree(n.id,depth+1):"");
    }).join("");
  }
  $("#side").innerHTML=`
    <div class="brand"><span class="logo">${I.check}</span><b>مهامي</b></div>
    <div class="sidescroll">
      ${views}
      <div class="sec-label">الأقسام</div>
      ${tree(null,0)}
    </div>
    <div class="sidefoot">
      <button class="btn-add-root" data-act="addroot">${I.plus} قسم رئيسي جديد</button>
      <div class="savestate" id="savestate"></div>
    </div>`;
  setState(state);
}

function taskRow(t,showPath){
  const open=UI.open===t.id;
  const col=colorOf(t.node);
  const path=pathOf(t.node);
  return `<li class="task ${t.status} ${open?"open":""}" data-id="${t.id}">
    <div class="trow">
      <button class="chk" data-act="toggle" data-id="${t.id}" aria-label="تم" title="تم">${I.check}</button>
      <div class="tmain" data-act="open" data-id="${t.id}" role="button" tabindex="0">
        <div class="ttitle">${esc(t.title)}</div>
        <div class="tmeta">
          ${showPath?`<span class="chip"><span class="dot" style="background:${col};width:8px;height:8px"></span>${esc(path.slice(-2).join(" › "))}</span>`:""}
          ${dueChip(t)}
          ${t.status==="doing"?`<span class="chip ex">شغّال عليها</span>`:""}
          ${t.ex?`<span class="chip ex">مثال</span>`:""}
          ${t.note?`<span>📝</span>`:""}
        </div>
      </div>
      ${t.prio>0?`<span class="pr p${t.prio}" title="${PRIO[t.prio][1]}">${I.flag}</span>`:""}
    </div>
    ${open?detail(t):""}
  </li>`;
}
function nodeOptions(sel){
  return flatNodes().map(({n,d})=>`<option value="${n.id}" ${n.id===sel?"selected":""}>${"— ".repeat(d)}${esc(n.name)}</option>`).join("");
}
function detail(t){
  return `<div class="detail" data-tid="${t.id}">
    <label class="full">العنوان<input data-f="title" value="${esc(t.title)}"></label>
    <label>الميعاد<input type="date" data-f="due" value="${t.due||""}"></label>
    <label>الأولوية<select data-f="prio">${PRIO.map(([v,l])=>`<option value="${v}" ${+v===t.prio?"selected":""}>${l}</option>`).join("")}</select></label>
    <label>الحالة<select data-f="status">${STAT.map(([v,l])=>`<option value="${v}" ${v===t.status?"selected":""}>${l}</option>`).join("")}</select></label>
    <label>القسم<select data-f="node">${nodeOptions(t.node)}</select></label>
    <label class="full">ملاحظات<textarea data-f="note" placeholder="تفاصيل، أرقام، أي حاجة محتاج تفتكرها">${esc(t.note)}</textarea></label>
    <div class="full actions">
      <button class="tbtn" data-act="close">إغلاق</button>
      <button class="tbtn danger ${UI.confirm==="t"+t.id?"armed":""}" data-act="deltask" data-id="${t.id}">${UI.confirm==="t"+t.id?"اضغط تاني للتأكيد":"مسح المهمة"}</button>
    </div>
  </div>`;
}
function listView(ts,showPath){
  if(!ts.length)return `<div class="empty"><b>مفيش مهام هنا</b>اكتب مهمة في الخانة اللي فوق واضغط Enter.</div>`;
  ts=ts.slice().sort(sortTasks);
  const today=todayStr();
  const groups=[];
  const sel=UI.sel;
  if(sel==="view:today"||sel==="view:upcoming"||sel==="view:all"||sel==="view:done"||true){
    const late=ts.filter(t=>t.status!=="done"&&t.due&&t.due<today);
    const now=ts.filter(t=>t.status!=="done"&&t.due===today);
    const soon=ts.filter(t=>t.status!=="done"&&t.due&&t.due>today);
    const none=ts.filter(t=>t.status!=="done"&&!t.due);
    const dn=ts.filter(t=>t.status==="done");
    if(late.length)groups.push(["متأخرة",late,"late"]);
    if(now.length)groups.push(["النهارده",now,""]);
    if(soon.length)groups.push(["الجاية",soon,""]);
    if(none.length)groups.push(["من غير ميعاد",none,""]);
    if(dn.length)groups.push(["خلصت",dn,""]);
  }
  return groups.map(([n,arr,c])=>`<div class="group-title ${c}">${n} <span>${num(arr.length)}</span></div><ul class="list">${arr.map(t=>taskRow(t,showPath)).join("")}</ul>`).join("");
}
function boardView(ts,showPath){
  return `<div class="board">${STAT.map(([k,l])=>{
    const arr=ts.filter(t=>t.status===k).sort(sortTasks);
    return `<div class="col" data-col="${k}"><h3>${l}<span>${num(arr.length)}</span></h3>
      <ul class="list">${arr.map(t=>taskRow(t,showPath).replace('<li class="task','<li draggable="true" class="task card')).join("")}</ul></div>`;
  }).join("")}</div>`;
}

function renderMain(){
  const sel=UI.sel,isView=sel.startsWith("view:");
  const n=isView?null:node(sel);
  if(!isView&&!n){UI.sel="view:today";return renderMain()}
  const ts=tasksForSel();
  const showPath=isView||kids(sel).length>0;
  const late=ts.filter(t=>t.status!=="done"&&t.due&&t.due<todayStr()).length;
  const openN=ts.filter(t=>t.status!=="done").length;
  const crumbs=isView?"":pathOf(sel).slice(0,-1).map(esc).join(" › ");
  const title=isView?VIEWS[sel][0]:n.name;
  const sub=isView?VIEWS[sel][1]:`${num(openN)} مهمة مفتوحة${late?` · ${num(late)} متأخرة`:""}${kids(sel).length?` · ${num(kids(sel).length)} أقسام فرعية`:""}`;
  let head=`<div class="head"><div style="min-width:0">
    ${crumbs?`<div class="crumbs">${crumbs}</div>`:""}
    ${UI.rename&&n?`<form class="inline-form" data-form="rename"><input id="renameIn" value="${esc(n.name)}" aria-label="اسم القسم"><button class="btn-primary">حفظ</button></form>`
      :`<h1>${isView?`<span style="color:var(--accent);font-size:26px;display:flex">${VIEWS[sel][2]}</span>`:`<span class="dot" style="background:${colorOf(sel)};width:14px;height:14px"></span>`}<span style="min-width:0;overflow-wrap:anywhere">${esc(title)}</span></h1>`}
    <div class="sub">${isView&&sel==="view:today"?new Date().toLocaleDateString("ar-EG",{weekday:"long",day:"numeric",month:"long"})+" · ":""}${sub}</div>
  </div>
  <div class="tools">
    <div class="seg"><button class="${UI.mode==="list"?"on":""}" data-act="mode" data-id="list">${I.list} قايمة</button><button class="${UI.mode==="board"?"on":""}" data-act="mode" data-id="board">${I.board} لوحة</button></div>
    <button class="tbtn" data-act="showdone">${UI.showDone?"إخفاء اللي خلصت":"إظهار اللي خلصت"}</button>
  </div></div>`;
  let nodeTools="";
  if(n){
    nodeTools=`<div class="tools">
      <button class="tbtn" data-act="addchild">${I.plus} قسم فرعي</button>
      <button class="tbtn" data-act="rename">تغيير الاسم</button>
      ${!n.parent?`<button class="tbtn" data-act="colorbox">اللون</button>`:""}
      <button class="tbtn danger ${UI.confirm==="n"+n.id?"armed":""}" data-act="delnode">${UI.confirm==="n"+n.id?"اضغط تاني للتأكيد (هيمسح القسم ومهامه)":"مسح القسم"}</button>
    </div>
    ${UI.addChild?`<form class="inline-form" data-form="addchild"><input id="childIn" placeholder="اسم القسم الفرعي داخل «${esc(n.name)}»" aria-label="اسم القسم الفرعي"><button class="btn-primary">إضافة</button></form>`:""}
    ${UI.color&&!n.parent?`<div class="swatches">${COLORS.map(c=>`<button class="sw ${n.color===c?"on":""}" style="background:${c}" data-act="setcolor" data-id="${c}" aria-label="لون"></button>`).join("")}</div>`:""}`;
  }
  const qnode=UI.qn&&node(UI.qn)?UI.qn:(flatNodes()[0]||{n:{id:""}}).n.id;
  const quick=`<form class="quick" data-form="quick">
    <div class="row1"><input type="text" id="qt" placeholder="${isView?"اكتب مهمة جديدة…":"مهمة جديدة في «"+esc(n.name)+"»…"}" autocomplete="off" aria-label="مهمة جديدة"><button class="btn-primary">${I.plus} إضافة</button></div>
    <div class="row2">
      ${isView?`<select class="field" id="qn" aria-label="القسم">${nodeOptions(qnode)}</select>`:""}
      <input class="field" type="date" id="qd" aria-label="الميعاد" value="${sel==="view:today"?todayStr():""}">
      <select class="field" id="qp" aria-label="الأولوية">${PRIO.map(([v,l])=>`<option value="${v}">${v==="0"?"أولوية":l}</option>`).join("")}</select>
      <button type="button" class="tbtn" data-act="qd" data-id="0">النهارده</button>
      <button type="button" class="tbtn" data-act="qd" data-id="1">بكرة</button>
    </div></form>`;
  $("#main").innerHTML=`
    <div class="topbar"><button class="menu-btn" data-act="drawer" aria-label="القائمة">${I.menu}</button><b style="font-family:var(--f-display);font-size:20px">مهامي</b></div>
    ${head}${nodeTools}${quick}
    ${UI.mode==="board"?boardView(ts,showPath):listView(ts,showPath)}`;
  $("#side").classList.toggle("show",UI.drawer);
  $("#scrim").classList.toggle("show",UI.drawer);
}
function render(){renderSide();renderMain()}

/* ---------- actions ---------- */
function resetTransient(){UI.rename=false;UI.addChild=false;UI.color=false;UI.confirm=false;UI.open=null}
function afterFocus(sel){requestAnimationFrame(()=>{const e=$(sel);if(e){e.focus();if(e.select)e.select()}})}
const taskById=id=>S.tasks.find(t=>t.id===id);

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");
  if(!el)return;
  const act=el.dataset.act,id=el.dataset.id;
  switch(act){
    case"sel":resetTransient();UI.sel=id;UI.drawer=false;saveUI();render();break;
    case"fold":{const n=node(id);n.open=!n.open;persist();renderSide();break}
    case"drawer":UI.drawer=!UI.drawer;renderMain();break;
    case"mode":UI.mode=id;saveUI();renderMain();break;
    case"showdone":UI.showDone=!UI.showDone;saveUI();renderMain();break;
    case"addroot":{
      const nid=uid("n");
      S.nodes.push({id:nid,name:"قسم جديد",parent:null,color:COLORS[S.nodes.filter(n=>!n.parent).length%7],open:true});
      persist();resetTransient();UI.sel=nid;UI.rename=true;UI.drawer=false;render();afterFocus("#renameIn");break}
    case"addchild":UI.addChild=!UI.addChild;UI.rename=false;renderMain();if(UI.addChild)afterFocus("#childIn");break;
    case"rename":UI.rename=!UI.rename;UI.addChild=false;renderMain();if(UI.rename)afterFocus("#renameIn");break;
    case"colorbox":UI.color=!UI.color;renderMain();break;
    case"setcolor":{node(UI.sel).color=id;persist();render();break}
    case"delnode":{
      if(UI.confirm!=="n"+UI.sel){UI.confirm="n"+UI.sel;renderMain();break}
      const ids=new Set(subtree(UI.sel)),p=node(UI.sel).parent;
      S.nodes=S.nodes.filter(n=>!ids.has(n.id));
      S.tasks=S.tasks.filter(t=>!ids.has(t.node));
      persist();resetTransient();UI.sel=p||"view:today";saveUI();render();break}
    case"toggle":{
      const t=taskById(id);t.status=t.status==="done"?"todo":"done";t.doneAt=t.status==="done"?Date.now():null;
      persist();render();break}
    case"open":UI.open=UI.open===id?null:id;UI.confirm=false;renderMain();break;
    case"close":UI.open=null;renderMain();break;
    case"deltask":{
      if(UI.confirm!=="t"+id){UI.confirm="t"+id;renderMain();break}
      S.tasks=S.tasks.filter(t=>t.id!==id);UI.open=null;UI.confirm=false;persist();render();break}
    case"qd":{const i=$("#qd");if(i)i.value=addDays(+id);break}
  }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){if(UI.rename||UI.addChild||UI.open||UI.drawer){UI.rename=UI.addChild=UI.drawer=false;UI.open=null;renderMain()}}
  if((e.key==="Enter"||e.key===" ")&&e.target.matches('.tmain[data-act="open"]')){e.preventDefault();e.target.click()}
});
$("#scrim").addEventListener("click",()=>{UI.drawer=false;renderMain()});
document.addEventListener("submit",e=>{
  const f=e.target.dataset.form;if(!f)return;
  e.preventDefault();
  if(f==="quick"){
    const ti=$("#qt"),title=ti.value.trim();
    if(!title){ti.focus();return}
    const isView=UI.sel.startsWith("view:");
    const nodeId=isView?$("#qn").value:UI.sel;
    if(!nodeId)return;
    if(isView)UI.qn=nodeId;
    S.tasks.push({id:uid("t"),node:nodeId,title,due:$("#qd").value||null,prio:+$("#qp").value,status:"todo",note:"",created:Date.now()});
    persist();render();afterFocus("#qt");
  }else if(f==="rename"){
    const v=$("#renameIn").value.trim();
    if(v){node(UI.sel).name=v;persist()}
    UI.rename=false;render();
  }else if(f==="addchild"){
    const v=$("#childIn").value.trim();
    if(v){const n=node(UI.sel);n.open=true;S.nodes.push({id:uid("n"),name:v,parent:n.id,color:null,open:true});persist();render();UI.addChild=true;renderMain();afterFocus("#childIn")}
  }
});
document.addEventListener("change",e=>{
  const fld=e.target.dataset&&e.target.dataset.f;if(!fld)return;
  const box=e.target.closest("[data-tid]");if(!box)return;
  const t=taskById(box.dataset.tid);if(!t)return;
  let v=e.target.value;
  if(fld==="title"){v=v.trim();if(!v){e.target.value=t.title;return}}
  if(fld==="prio")v=+v;
  if(fld==="due"&&!v)v=null;
  if(fld==="status"){t.doneAt=v==="done"?Date.now():null}
  t[fld]=v;t.ex=false;
  persist();render();
});
/* drag & drop on board */
let dragId=null;
document.addEventListener("dragstart",e=>{const li=e.target.closest&&e.target.closest("li.task");if(!li)return;dragId=li.dataset.id;li.classList.add("dragging");try{e.dataTransfer.setData("text/plain",dragId);e.dataTransfer.effectAllowed="move"}catch(x){}});
document.addEventListener("dragend",()=>{dragId=null;document.querySelectorAll(".dragging,.over").forEach(x=>x.classList.remove("dragging","over"))});
document.addEventListener("dragover",e=>{const c=e.target.closest&&e.target.closest(".col");if(c&&dragId){e.preventDefault();document.querySelectorAll(".col.over").forEach(x=>x!==c&&x.classList.remove("over"));c.classList.add("over")}});
document.addEventListener("drop",e=>{
  const c=e.target.closest&&e.target.closest(".col");if(!c||!dragId)return;
  e.preventDefault();
  const t=taskById(dragId);if(t&&t.status!==c.dataset.col){t.status=c.dataset.col;t.doneAt=t.status==="done"?Date.now():null;persist()}
  dragId=null;render();
});

render();
connect();
})();
</script>
